<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Anonymous venting platform - Share your thoughts freely and anonymously">
    <title>Venting</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    <circle cx="9" cy="10" r="0.5" fill="currentColor"/>
                    <circle cx="12" cy="10" r="0.5" fill="currentColor"/>
                    <circle cx="15" cy="10" r="0.5" fill="currentColor"/>
                </svg>
                <h1>Venting</h1>
            </div>
        </header>

        <!-- Compose Box -->
        <div class="compose-box">
            <div class="compose-header">
                <span class="anonymous-indicator">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                    Anonymous
                </span>
                <div class="char-counter">
                    <span id="charCount">0</span> / 500
                </div>
            </div>
            <textarea
                id="postContent"
                placeholder="What's on your mind?"
                maxlength="500"
            ></textarea>
            <div class="compose-footer">
                <div class="auto-refresh-status">
                    <svg class="refresh-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                    </svg>
                    <span>Auto-updating</span>
                </div>
                <button id="postBtn" class="post-btn" disabled>
                    <span>Post</span>
                </button>
            </div>
        </div>

        <!-- Timeline -->
        <div class="timeline">
            <div class="timeline-header">
                <h2>Timeline</h2>
                <div class="post-count" id="postCount"></div>
            </div>

            <div id="postsContainer" class="posts">
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                </div>
            </div>

            <!-- Pagination -->
            <div class="pagination" id="pagination" style="display: none;">
                <button id="prevBtn" class="pagination-btn" disabled>
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                    </svg>
                    Previous
                </button>
                <span class="page-info">
                    Page <span id="currentPage">1</span> of <span id="totalPages">1</span>
                </span>
                <button id="nextBtn" class="pagination-btn">
                    Next
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Notification -->
    <div id="notification" class="notification"></div>

    <!-- Online Users Indicator -->
    <div class="online-users-indicator" id="onlineUsersIndicator">
        <svg viewBox="0 0 24 24" fill="currentColor" class="online-icon">
            <circle cx="12" cy="12" r="10" opacity="0.2"/>
            <circle cx="12" cy="12" r="3" class="pulse"/>
        </svg>
        <span id="onlineUsersCount">0</span> online
    </div>

    <script src="app.js"></script>
</body>
</html>

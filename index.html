<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Anonymous venting platform - Share your thoughts freely and anonymously">
    <title>Venting</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main Layout -->
    <div class="layout">
        <!-- Left Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-content">
                <div class="logo">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                    </svg>
                </div>
                <nav class="nav">
                    <a href="#" class="nav-item active">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 9c-2.49 0-4.5 2.01-4.5 4.5S9.51 18 12 18s4.5-2.01 4.5-4.5S14.49 9 12 9zm0 7c-1.38 0-2.5-1.12-2.5-2.5S10.62 11 12 11s2.5 1.12 2.5 2.5S13.38 16 12 16z"/><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
                        </svg>
                        <span>Timeline</span>
                    </a>
                </nav>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main">
            <!-- Header -->
            <div class="main-header">
                <h1>Home</h1>
            </div>

            <!-- Compose -->
            <div class="compose">
                <div class="compose-avatar">
                    <div class="avatar">A</div>
                </div>
                <div class="compose-content">
                    <textarea
                        id="postContent"
                        placeholder="What's happening?!"
                        maxlength="5000"
                    ></textarea>
                    <div class="compose-footer">
                        <div class="compose-actions">
                            <span class="anonymous-badge">
                                <svg viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
                                </svg>
                                Anonymous
                            </span>
                        </div>
                        <div class="compose-submit">
                            <span class="char-counter">
                                <svg class="circle-progress" viewBox="0 0 20 20">
                                    <circle class="circle-bg" cx="10" cy="10" r="9"></circle>
                                    <circle class="circle-bar" cx="10" cy="10" r="9" id="progressCircle"></circle>
                                </svg>
                                <span id="charCount" class="count-text"></span>
                            </span>
                            <button id="postBtn" class="post-btn" disabled>Post</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Timeline -->
            <div id="postsContainer" class="posts">
                <!-- Loading -->
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                </div>
            </div>

            <!-- Pagination -->
            <div class="pagination" id="pagination" style="display: none;">
                <button id="prevBtn" class="pagination-btn" disabled>
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                    </svg>
                    Previous
                </button>
                <span class="page-info">
                    <span id="currentPage">1</span> / <span id="totalPages">1</span>
                </span>
                <button id="nextBtn" class="pagination-btn">
                    Next
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
                    </svg>
                </button>
            </div>
        </main>

        <!-- Right Sidebar -->
        <aside class="widgets">
            <div class="widget">
                <div class="widget-header">About</div>
                <div class="widget-content">
                    <p>Share your thoughts anonymously. No accounts, no tracking, completely free.</p>
                    <div class="auto-refresh-indicator">
                        <svg class="refresh-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                        </svg>
                        <span>Auto-updating</span>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <!-- Notification -->
    <div id="notification" class="notification"></div>

    <script src="app.js"></script>
</body>
</html>

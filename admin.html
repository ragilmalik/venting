<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Venting</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Admin-specific styles */
        .admin-container {
            width: 75%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .login-panel {
            max-width: 400px;
            margin: 100px auto;
            padding: 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            animation: slideInUp 0.6s ease-out;
        }

        .login-panel h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            background: linear-gradient(135deg, #ffffff 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(29, 155, 240, 0.15);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            border: none;
            border-radius: 24px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            background: #1a8cd8;
            box-shadow: 0 4px 20px rgba(29, 155, 240, 0.5);
            transform: translateY(-2px);
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            animation: slideInUp 0.6s ease-out;
        }

        .admin-header h1 {
            font-size: 24px;
            background: linear-gradient(135deg, #ffffff 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logout-btn {
            padding: 10px 24px;
            background: rgba(244, 33, 46, 0.2);
            border: 1px solid rgba(244, 33, 46, 0.4);
            border-radius: 24px;
            color: var(--error);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: var(--error);
            color: white;
            box-shadow: 0 4px 20px rgba(244, 33, 46, 0.5);
        }

        .controls-panel {
            margin-bottom: 24px;
            padding: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            animation: slideInUp 0.6s ease-out 0.1s both;
        }

        .search-box {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .search-input {
            flex: 1;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(29, 155, 240, 0.15);
        }

        .btn {
            padding: 10px 20px;
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-search {
            background: var(--accent);
            color: white;
        }

        .btn-search:hover {
            background: #1a8cd8;
            box-shadow: 0 4px 12px rgba(29, 155, 240, 0.3);
        }

        .btn-clear {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
        }

        .btn-clear:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        .bulk-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn-danger {
            background: rgba(244, 33, 46, 0.2);
            color: var(--error);
            border-color: rgba(244, 33, 46, 0.4);
        }

        .btn-danger:hover {
            background: var(--error);
            color: white;
            box-shadow: 0 4px 12px rgba(244, 33, 46, 0.3);
        }

        .posts-table-container {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideInUp 0.6s ease-out 0.2s both;
        }

        .posts-table {
            width: 100%;
            border-collapse: collapse;
        }

        .posts-table thead {
            background: rgba(29, 155, 240, 0.1);
        }

        .posts-table th {
            padding: 16px;
            text-align: left;
            font-weight: 700;
            color: var(--accent);
            border-bottom: 1px solid var(--glass-border);
        }

        .posts-table td {
            padding: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            vertical-align: top;
        }

        .posts-table tr {
            transition: all 0.3s ease;
        }

        .posts-table tbody tr:hover {
            background: rgba(29, 155, 240, 0.05);
        }

        .post-content-cell {
            max-width: 400px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .ip-cell {
            font-family: 'Courier New', monospace;
            color: var(--accent);
        }

        .time-cell {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .actions-cell {
            text-align: center;
        }

        .delete-btn {
            padding: 6px 16px;
            background: rgba(244, 33, 46, 0.2);
            border: 1px solid rgba(244, 33, 46, 0.4);
            border-radius: 16px;
            color: var(--error);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .delete-btn:hover {
            background: var(--error);
            color: white;
            box-shadow: 0 0 20px rgba(244, 33, 46, 0.4);
        }

        .checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .stats-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            padding: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
            animation: slideInUp 0.6s ease-out both;
        }

        .stat-card:nth-child(1) { animation-delay: 0s; }
        .stat-card:nth-child(2) { animation-delay: 0.05s; }
        .stat-card:nth-child(3) { animation-delay: 0.1s; }
        .stat-card:nth-child(4) { animation-delay: 0.15s; }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @media (max-width: 768px) {
            .admin-container {
                width: 90%;
                padding: 12px;
            }

            .posts-table {
                font-size: 13px;
            }

            .posts-table th,
            .posts-table td {
                padding: 10px;
            }

            .post-content-cell {
                max-width: 200px;
            }
        }
    </style>
</head>
<body>
    <div id="app" class="admin-container"></div>

    <div id="notification" class="notification"></div>

    <script src="admin.js"></script>
</body>
</html>
